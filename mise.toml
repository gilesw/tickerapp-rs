[tools]
actionlint = "1.7.12"
git-cliff = "2.14.2"
rust = { version = "1.98.1", components = "clippy,rustfmt" }
shellcheck = "0.10.0"
"github:bnjbvr/cargo-machete" = "0.9.2"

[tasks."sdk:tool"]
description = "Install the pinned generator into target/tools"
run = "cargo install --locked --quiet --root target/tools openapi-to-rust@0.22.0"

[tasks.generate]
description = "Regenerate the client from the checked-in Ticker.app specification"
depends = ["sdk:tool"]
run = "target/tools/bin/openapi-to-rust generate --config openapi-to-rust.toml"

[tasks."generate:check"]
description = "Fail when generated output is stale"
depends = ["sdk:tool"]
run = "target/tools/bin/openapi-to-rust generate --config openapi-to-rust.toml --check"

[tasks.fmt]
description = "Format the crate (the only task that rewrites source)"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting without changing files"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Clippy on all targets with warnings denied"
run = "cargo clippy --all-targets --locked -- -D warnings"

[tasks.test]
description = "Unit and mock-server tests"
run = "cargo test --locked"

[tasks."lint:scripts"]
description = "ShellCheck the release scripts and run their tests"
run = [
  "shellcheck --shell=bash scripts/*.sh",
  "python3 scripts/test-bump.py",
  "python3 scripts/test-tag.py",
  "python3 scripts/test-publish.py",
]

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks."lint:deps"]
description = "Unused dependencies in the crate manifest"
run = "cargo machete"

[tasks."check:fast"]
description = "Read-only formatting, script, workflow and dependency lint"
run = ["mise run fmt:check", "mise run lint:scripts", "mise run lint:actions", "mise run lint:deps"]

[tasks.check]
description = "The merge gate: fast checks, Clippy, tests and generated-output staleness"
run = ["mise run check:fast", "mise run lint", "mise run test", "mise run generate:check"]

[tasks.bump]
description = "Raise the crate version and insert its changelog section: bump major|minor|patch"
dir = "{{config_root}}"
run = "bash scripts/bump.sh"

[tasks.tag]
description = "Create and push the annotated tag for the Cargo.toml version; --no-push only creates it"
dir = "{{config_root}}"
run = "bash scripts/tag.sh"

[tasks.release]
description = "Dry-run the release, detecting the version tag at HEAD"
dir = "{{config_root}}"
run = "bash scripts/publish.sh"

[tasks."release:publish"]
description = "Publish the tagged release to crates.io after all checks"
dir = "{{config_root}}"
run = "bash scripts/publish.sh --publish"

[tasks."release:login"]
description = "Optional Cargo login when not using CARGO_REGISTRY_TOKEN"
dir = "{{config_root}}"
raw = true
run = "cargo login --registry crates-io"
