[generator]
spec_path = "specs/tickerapp.openapi.yaml"
output_dir = "src/generated"
effective_spec = "effective.json"
module_name = "generated"
overlays = ["specs/tickerapp.overlay.yaml"]

[features]
enable_async_client = true
enable_sse_client = false

[http_client]
base_url = "https://api.tickerapp.net/v2"
timeout_seconds = 30
max_response_body_bytes = 8388608

[http_client.tracing]
enabled = false

[http_client.auth]
type = "ApiKey"
header_name = "x-api-key"

[extensible_enums]
"PriceSnapshotQuoteChangeDirection" = true
"CategoryKind" = true
"CategoryImportance" = true

[nullable_overrides]
"DisclosureItem.version" = true
