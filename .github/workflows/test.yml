# The locked build and every test, on every branch push.
name: test

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - run: mise run test
