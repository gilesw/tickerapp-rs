# Static checks on every branch push: the cheap linters in one job, Clippy in
# another and generated-output staleness in a third. Each job runs one mise
# task, so the local gate and this workflow cannot disagree about what a check is.
name: lint

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: format, scripts, actions, deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: lint-fast-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
      - run: mise run check:fast

      # These tasks claim to be read-only; a modified tree means one is not.
      - name: Assert the checks changed nothing
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the checks modified the working tree:" >&2
            git status --porcelain >&2
            git --no-pager diff >&2
            exit 1
          fi

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: lint-clippy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - run: mise run lint

  generated:
    # The pinned generator is built once per mise.toml and cached between runs.
    name: generated output is current
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: lint-generated-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
      - uses: actions/cache@v4
        with:
          path: target/tools
          key: sdk-tool-${{ runner.os }}-${{ hashFiles('mise.toml') }}
      - run: mise run generate:check
      - name: Assert the check changed nothing
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the check modified the working tree:" >&2
            git status --porcelain >&2
            git --no-pager diff >&2
            exit 1
          fi
