overlay: 1.1.0
info:
  title: Ticker.app price snapshots with every field optional
  version: 1.0.0
actions:
  - target: "$.components.schemas.PriceSnapshot..required"
    remove: true
  - target: "$.components.schemas.CursorPaging.properties"
    update:
      latestCursor:
        type: string
        nullable: true
        description: Additional opaque cursor observed in live disclosure pagination on 2026-10-03.
  - target: "$.components.schemas.PriceSnapshot.properties.year.properties.high.properties.date"
    update:
      format: date-time
      description: 52-week high date; the live API sends a full timestamp.
  - target: "$.components.schemas.PriceSnapshot.properties.year.properties.low.properties.date"
    update:
      format: date-time
      description: 52-week low date; the live API sends a full timestamp.
  - target: "$.components.schemas.Category.properties.kind.enum"
    update: RNS
  - target: "$.components.schemas.PriceSnapshot.properties.year.properties.volume.properties.average"
    update:
      type: number
      description: 52-week average daily volume; the live API sends a fraction.
